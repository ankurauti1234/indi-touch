<!DOCTYPE html>
<html>

<body>
    <h2>Remote Event Tester</h2>

    <script>
        const events = [
            "keydown",
            "keyup",
            "keypress",
            "mousedown",
            "mouseup",
            "pointerdown",
            "pointerup",
            "click",
            "auxclick",
            "contextmenu",
            "beforeinput",
            "input"
        ];

        events.forEach(type => {
            window.addEventListener(type, e => {
                console.clear();
                console.log("EVENT:", type);
                console.log({
                    key: e.key,
                    code: e.code,
                    keyCode: e.keyCode,
                    which: e.which,
                    button: e.button,
                    buttons: e.buttons
                });
            }, true);
        });

        window.addEventListener("popstate", () => {
            console.log("POPSTATE");
        });

        window.addEventListener("hashchange", () => {
            console.log("HASHCHANGE");
        });
    </script>

</body>

</html>
